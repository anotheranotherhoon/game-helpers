<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>게임 테이블 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a game-table companion — scoreboard, the round's board, then the win log */
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5b6875;
  --line: #d4dce4;
  --board: #2b3b4d;
  --card-rim: #5fb3b3;
  --accent: #d9532b;
  --accent-ink: #ffffff;
  --p1: #e5483f;
  --p2: #3a86e8;
  --p3: #f07c1e;
  --card-bg: #fdfdfb;
  --card-edge: #cfd5db;
  --suit-red: #d4322c;
  --suit-black: #1b2027;
  --win: #2f9e6a;
  --win-ink: #ffffff;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a222b; --ink: #e8edf2; --muted: #95a3b0; --line: #2d3945;
    --board: #2c3d50; --card-rim: #3f8585;
    --accent: #f07046; --accent-ink: #1a0d07; --card-bg: #f2f1ec; --card-edge: #3a4652; --suit-red: #d8342e; --suit-black: #161a20; --win: #45c089; --win-ink: #08231a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a222b; --ink: #e8edf2; --muted: #95a3b0; --line: #2d3945;
  --board: #2c3d50; --card-rim: #3f8585;
  --accent: #f07046; --accent-ink: #1a0d07; --card-bg: #f2f1ec; --card-edge: #3a4652; --suit-red: #d8342e; --suit-black: #161a20; --win: #45c089; --win-ink: #08231a; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
h1 small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-top: 4px; }
h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; text-wrap: balance; }
.label { font-size: 12px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: 13px; }

.reset-box { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.reset-box .q { font-size: 13px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }

/* setup */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 8px 18px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.names { display: flex; flex-direction: column; gap: 10px; }
.name-row { display: flex; align-items: center; gap: 10px; }
.name-row input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.dot { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75), transparent 38%), var(--c); box-shadow: inset 0 -2px 3px rgba(0,0,0,.25); }
.field { display: flex; flex-direction: column; gap: 8px; }

/* scoreboard */
.scores { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 10px; }
.score { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; min-width: 0; }
.score[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset; }
.score .who { min-width: 0; flex: 1; }
.score .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score .sub { font-size: 12px; color: var(--muted); }
.score .n { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }

/* challenge card: black card, white balls, no grid */
.card-face { position: relative; width: 100%; max-width: 100%; aspect-ratio: 5 / 6; border-radius: 10%; background: #111315; box-shadow: 0 0 0 3px var(--card-rim), 0 8px 18px rgba(10, 20, 30, .2); }
.card-face .field-area { position: absolute; left: 8%; right: 8%; top: 12%; aspect-ratio: 1; }
.card-face .b { position: absolute; width: 20%; height: 20%; padding: 2.5%; }
.card-face .b::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), transparent 34%), var(--ball, #f6f5ee); box-shadow: inset 0 -4px 6px rgba(0,0,0,.3); }
.card-face.big { max-width: 280px; margin: 0 auto; }
.card-face.big .b::after { animation: drop .38s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * 80ms); }
@keyframes drop { from { transform: translateY(-30%) scale(.6); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .card-face.big .b::after { animation: none; } }

.stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pick button { padding: 18px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pick button:hover { border-color: var(--accent); }
.pick .big-n { font-family: var(--display); font-size: 34px; line-height: 1; }
.pick .balls { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.pick .balls i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.8), transparent 38%), var(--board); }
.pick .last { font-size: 12px; color: var(--muted); }
.pick .custom { grid-column: 1 / -1; flex-direction: row; justify-content: center; padding: 14px; font-weight: 700; border-style: dashed; }

/* custom editor: 5x5 tap grid on the same black card */
.editor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6%; padding: 9%; width: 100%; max-width: 280px; margin: 0 auto; aspect-ratio: 1; border-radius: 10%; background: #111315; box-shadow: 0 0 0 3px var(--card-rim); }
.editor button { border-radius: 50%; border: 2px dashed rgba(255,255,255,.22); aspect-ratio: 1; }
.editor button[aria-pressed="true"] { border: 0; background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.95), transparent 34%), #f6f5ee; box-shadow: inset 0 -4px 6px rgba(0,0,0,.3); }
.editor button:focus-visible { outline-color: var(--card-rim); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.answer-meta { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.answer-meta .shape { font-family: var(--display); font-size: 26px; }
.answer-meta .hint { font-size: 13px; color: var(--muted); }
.winners { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 10px; }
.winners button { padding: 14px 8px; border-radius: 12px; font-weight: 700; color: #fff; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.winners button.orange { color: #2a1400; }
.row-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

.toast { text-align: center; font-size: 14px; padding: 10px; border-radius: 10px; background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); }

/* history */
.hist-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.card .card-face { box-shadow: 0 0 0 2px var(--card-rim); }
.card .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .bot { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; min-width: 0; }
.card .bot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .bot .dot { width: 12px; height: 12px; }
.empty { color: var(--muted); font-size: 14px; padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

.sample { display: flex; gap: 14px; align-items: center; }
.sample .card-face { width: 84px; flex: none; }
.sample p { margin: 0; color: var(--muted); font-size: 14px; }

/* tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--line); }
.tabs button { padding: 10px; border-radius: 9px; font-family: var(--display); font-size: 18px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* hold'em */
.pk-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.pk-group { display: flex; flex-direction: column; gap: 4px; }
.pk-group .label { text-align: center; }
.pk-group .slots { display: flex; gap: 6px; }
.pk-slot { width: 46px; aspect-ratio: 5 / 7; border-radius: 7px; border: 2px dashed var(--line); background: transparent; display: grid; place-items: center; padding: 0; flex: none; }
.pk-slot.sel { border: 2px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.pk-card { width: 100%; height: 100%; border-radius: 5px; background: var(--card-bg); border: 1px solid var(--card-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-weight: 700; color: var(--suit-black); }
.pk-card.red { color: var(--suit-red); }
.pk-card .r { font-size: 18px; letter-spacing: -0.04em; }
.pk-card .s { font-size: 16px; }
.pk-slot.sel .pk-card { border-color: transparent; }
.pk-mini { display: flex; gap: 3px; flex-wrap: wrap; }
.pk-mini .pk-card { width: 26px; height: 36px; border-radius: 4px; }
.pk-mini .pk-card .r { font-size: 12px; }
.pk-mini .pk-card .s { font-size: 11px; }
.pk-mini .pk-card.dim { opacity: .35; }

.pk-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 36px; height: 34px; font-size: 18px; font-weight: 700; }
.stepper button:disabled { opacity: .3; cursor: not-allowed; }
.stepper span { min-width: 52px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

.pk-players { display: flex; flex-direction: column; gap: 10px; }
.pk-player { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.pk-player.win { border-color: var(--win); box-shadow: 0 0 0 2px var(--win) inset; }
.pk-player .num { font-family: var(--display); font-size: 20px; width: 34px; text-align: center; }
.pk-player .slots { display: flex; gap: 6px; }
.pk-player .res { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.pk-player .hand { font-weight: 700; font-size: 14px; }
.pk-player .detail { font-size: 12px; color: var(--muted); }
.pk-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--win); color: var(--win-ink); margin-left: 6px; vertical-align: 1px; }
.eq { display: flex; align-items: center; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.eq .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 40px; }
.eq .bar i { display: block; height: 100%; background: var(--win); }
.eq b { min-width: 46px; text-align: right; }
@media (max-width: 420px) {
  .pk-player { grid-template-columns: auto auto; }
  .pk-player .res { grid-column: 1 / -1; }
}

.verdict { padding: 14px; border-radius: 12px; background: color-mix(in srgb, var(--win) 14%, var(--surface)); display: flex; flex-direction: column; gap: 2px; }
.verdict strong { font-family: var(--display); font-weight: 400; font-size: 22px; }
.verdict span { font-size: 13px; color: var(--muted); }

.picker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0,0,0,.12); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.picker .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.picker .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.picker .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
.picker .grid button { aspect-ratio: 5 / 7; border-radius: 4px; background: var(--card-bg); border: 1px solid var(--card-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-weight: 700; font-size: 12px; color: var(--suit-black); padding: 0; min-width: 0; }
.picker .grid button.red { color: var(--suit-red); }
.picker .grid button:disabled { opacity: .18; cursor: not-allowed; }
.picker .grid button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.picker .grid .s { font-size: 11px; }
body.picking .wrap { padding-bottom: 240px; }

.ranks { display: flex; flex-direction: column; gap: 0; }
.ranks summary { cursor: pointer; font-family: var(--display); font-size: 20px; list-style-position: inside; }
.ranks ol { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: rk; }
.ranks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: 14px; counter-increment: rk; }
.ranks li::before { content: counter(rk); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; text-align: right; }
.ranks li .ex { font-size: 12px; color: var(--muted); white-space: nowrap; }
.pk-note { font-size: 12px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>게임 테이블 도우미<small id="sub">판마다 정답 카드를 뽑고, 어느 팀이 이겼는지 기록합니다</small></h1>
    <div class="reset-box" id="resetBox"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="게임 고르기">
    <button role="tab" data-tab="bounce" aria-selected="true">바운스 오프</button>
    <button role="tab" data-tab="holdem" aria-selected="false">텍사스 홀덤</button>
  </nav>
  <main id="app" style="display:flex;flex-direction:column;gap:22px"></main>
  <main id="holdem" style="display:flex;flex-direction:column;gap:22px" hidden></main>
</div>

<script>
const MAX = 5; // largest shape span, sets ball size on the card
const COLORS = [
  { key: "red", v: "var(--p1)" },
  { key: "blue", v: "var(--p2)" },
  { key: "orange", v: "var(--p3)" },
];
// every shape is edge-connected (상하좌우로 붙어 있음); rotations and mirror images are drawn at random
const SHAPES = {
  3: [
    { name: "일자", c: [[0,0],[0,1],[0,2]] },
    { name: "ㄱ자", c: [[0,0],[0,1],[1,1]] },
  ],
  4: [
    { name: "일자", c: [[0,0],[0,1],[0,2],[0,3]] },
    { name: "네모", c: [[0,0],[0,1],[1,0],[1,1]] },
    { name: "T자", c: [[0,0],[0,1],[0,2],[1,1]] },
    { name: "L자", c: [[0,0],[1,0],[2,0],[2,1]] },
    { name: "S자", c: [[0,1],[0,2],[1,0],[1,1]] },
  ],
  5: [
    { name: "일자", c: [[0,0],[0,1],[0,2],[0,3],[0,4]] },
    { name: "L자", c: [[0,0],[1,0],[2,0],[3,0],[3,1]] },
    { name: "T자", c: [[0,1],[1,1],[2,0],[2,1],[2,2]] },
    { name: "Y자", c: [[0,1],[1,0],[1,1],[2,1],[3,1]] },
    { name: "P자", c: [[0,0],[0,1],[1,0],[1,1],[2,0]] },
    { name: "N자", c: [[0,1],[1,1],[2,0],[2,1],[3,0]] },
    { name: "U자", c: [[0,0],[0,2],[1,0],[1,1],[1,2]] },
    { name: "V자", c: [[0,0],[1,0],[2,0],[2,1],[2,2]] },
    { name: "계단", c: [[0,0],[1,0],[1,1],[2,1],[2,2]] },
    { name: "십자", c: [[0,1],[1,0],[1,1],[1,2],[2,1]] },
    { name: "Z자", c: [[0,0],[0,1],[1,1],[2,1],[2,2]] },
    { name: "F자", c: [[0,1],[0,2],[1,0],[1,1],[2,1]] },
  ],
};

// ---------- shape generation ----------
function normalize(cells) {
  const mr = Math.min(...cells.map(p => p[0])), mc = Math.min(...cells.map(p => p[1]));
  return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function variants(cells) {
  const out = new Map();
  let cur = cells;
  for (let rot = 0; rot < 4; rot++) {
    cur = cur.map(([r, c]) => [c, -r]);
    for (const v of [cur, cur.map(([r, c]) => [r, -c])]) {
      const n = normalize(v);
      out.set(JSON.stringify(n), n);
    }
  }
  return [...out.values()];
}
const rnd = n => Math.floor(Math.random() * n);
function makeAnswer(size, avoidKey) {
  for (let tries = 0; tries < 30; tries++) {
    const shape = SHAPES[size][rnd(SHAPES[size].length)];
    const vs = variants(shape.c);
    const cells = vs[rnd(vs.length)];
    if (JSON.stringify(cells) !== avoidKey || tries === 29) return { size, shape: shape.name, cells };
  }
}

// ---------- state ----------
const STORE = "bounce-off-helper-v2";
function freshState() {
  return { phase: "setup", count: 2, names: ["", "", ""], players: [], rounds: [], current: null, filter: "all", toast: null };
}
let S = freshState();
let confirmingReset = false;
try { const saved = JSON.parse(localStorage.getItem(STORE)); if (saved && saved.phase) S = { ...freshState(), ...saved, toast: null }; } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

// ---------- rendering helpers ----------
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "style") el.style.cssText = v;
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
function card(cells, { big = false, ball = null } = {}) {
  const w = Math.max(...cells.map(p => p[1])) + 1, hgt = Math.max(...cells.map(p => p[0])) + 1;
  const face = h("div", { class: "card-face" + (big ? " big" : ""), role: "img", "aria-label": `공 ${cells.length}개 정답 모양` });
  if (ball) face.style.setProperty("--ball", ball);
  const area = h("div", { class: "field-area" });
  cells.forEach(([r, c], i) => {
    const b = h("span", { class: "b" });
    b.style.left = ((c + (MAX - w) / 2) * 100 / MAX) + "%";
    b.style.top = ((r + (MAX - hgt) / 2) * 100 / MAX) + "%";
    b.style.setProperty("--i", i);
    area.append(b);
  });
  face.append(area);
  return face;
}
const colorOf = i => COLORS[S.players[i]?.color ?? i].v;
const dot = c => { const d = h("span", { class: "dot", "aria-hidden": "true" }); d.style.setProperty("--c", c); return d; };
const winsOf = i => S.rounds.filter(r => r.winner === i).length;

function renderReset() {
  const box = document.getElementById("resetBox");
  box.replaceChildren();

<script>

const SUITS = ["♠", "♥", "♦", "♣"];

function straightHigh(mask) {

  for (let hi = 14; hi >= 5; hi--) if (((mask >> (hi - 4)) & 31) === 31) return hi;
  return 0;
}

  let mask = 0;
  for (const c of cards) { const r = rankOf(c), s = suitOf(c); cnt[r]++; mask |= 1 << r; sm[s] |= 1 << r; sc[s]++; }
  let flush = -1;
  for (let s = 0; s < 4; s++) if (sc[s] >= 5) { const hi = straightHigh(sm[s]); if (hi) return pack(8, [hi]); flush = s; }
  const quads = [], trips = [], pairs = [], singles = [];
  for (let r = 14; r >= 2; r--) ({ 4: quads, 3: trips, 2: pairs, 1: singles })[cnt[r]]?.push(r);
  const rest = (...skip) => { const o = []; for (let r = 14; r >= 2; r--) if (cnt[r] && !skip.includes(r)) o.push(r); return o; };
  if (quads.length) return pack(7, [quads[0], rest(quads[0])[0]]);
  if (trips.length && (trips.length > 1 || pairs.length)) return pack(6, [trips[0], Math.max(trips[1] || 0, pairs[0] || 0)]);
  if (flush >= 0) { const o = []; for (let r = 14; r >= 2 && o.length < 5; r--) if (sm[flush] & (1 << r)) o.push(r); return pack(5, o); }

    case 7: return `${k[0]} 네 장${kick(k.slice(1))}`;
    case 6: return `${k[0]} 세 장 + ${k[1]} 두 장`;
    case 5: return `${k[0]} 하이 (${k.join(" ")})`;
    case 4: return `${k[0]} 하이`;
    case 3: return `${k[0]} 세 장${kick(k.slice(1))}`;
    case 2: return `${k[0]} 페어 + ${k[1]} 페어${kick(k.slice(2))}`;

    verdict = h("div", { class: "verdict" },
      h("strong", {}, `지금은 ${leaders.map(i => i + 1).join("번, ")}번이 앞서요`),
      h("span", {}, `${handName(top)} · 리버까지 넣으면 최종 판정이 나와요`));
  }

  // players
  const list = h("div", { class: "pk-players" });
  hands.forEach((hd, p) => {
    const s = scores[p];
    const isWin = verdict && leaders.includes(p) && boardCards.length >= 3 && allIn;
    const res = h("div", { class: "res" });
    if (s != null && boardCards.length + hd.filter(c => c != null).length >= 2) {
      const all = boardCards.concat(hd.filter(c => c != null));
      const five = orderHand(best5(all));
      res.append(...[
        h("div", { class: "hand" }, handName(s), isWin && boardCards.length === 5 ? h("span", { class: "pk-badge" }, leaders.length > 1 ? "공동 1등" : "승리") : null),
        h("div", { class: "detail" }, handDetail(s)),
        all.length >= 5 ? h("div", { class: "pk-mini", "aria-label": "가장 높은 5장" }, five.map(c => pcard(c))) : null].filter(Boolean));
    } else {
      res.append(h("div", { class: "detail" }, "카드 2장을 넣어주세요"));
    }
    res.append(h("div", { class: "eq", id: `eq-${p}` }, h("span", {}, "승률"), h("span", { class: "bar" }, h("i", { style: "width:0%" })), h("b", {}, "–")));
    list.append(h("div", { class: "pk-player" + (isWin ? " win" : "") },
      h("span", { class: "num" }, `${p + 1}`),
      h("div", { class: "slots" }, [0, 1].map(i => slotBtn({ t: "p", p, i }))),
      res));
  });
  const pp = h("section", { class: "panel" },
    h("div", { class: "pk-head" }, h("h2", {}, "플레이어 패"),
      h("div", { class: "stepper", role: "group", "aria-label": "인원" },
        h("button", { "aria-label": "한 명 빼기", disabled: H.n <= 2, on: { click: () => { H.hands[H.n - 1] = [null, null]; H.n--; if (H.sel?.t === "p" && H.sel.p >= H.n) H.sel = null; hsave(); renderHoldem(); } } }, "−"),
        h("span", {}, `${H.n}명`),
        h("button", { "aria-label": "한 명 더하기", disabled: H.n >= 9, on: { click: () => { H.n++; hsave(); renderHoldem(); } } }, "+"))),
    verdict, list,
    h("p", { class: "pk-note", id: "eq-note" }, "승률은 카드를 넣으면 계산돼요. 패를 모르는 사람은 무작위 카드로 가정해요."),
    h("div", { class: "row-actions" }, h("button", { class: "btn", on: { click: () => { H = freshHoldem(H.n); hsave(); renderHoldem(); } } }, "새 판 (카드 모두 비우기)")),
  );

  // hand ranking reference
  const ex = [["로열 스트레이트 플러시", "A♠ K♠ Q♠ J♠ 10♠"], ["스트레이트 플러시", "9♥ 8♥ 7♥ 6♥ 5♥"], ["포카드", "Q Q Q Q 7"], ["풀하우스", "8 8 8 K K"], ["플러시", "같은 무늬 5장"], ["스트레이트", "5 6 7 8 9"], ["트리플", "7 7 7 K 2"], ["투 페어", "J J 4 4 A"], ["원 페어", "10 10 A 8 3"], ["하이카드", "A J 9 6 2"]];
  const rk = h("details", { class: "panel ranks" }, h("summary", {}, "족보 순서"),
    h("ol", {}, ex.map(([n, e]) => h("li", {}, h("span", {}, n), h("span", { class: "ex" }, e)))),
    h("p", { class: "pk-note", style: "margin-top:12px" }, "킥커는 족보가 같을 때 승부를 가르는 나머지 카드예요. 예를 들어 둘 다 10 페어면 킥커가 높은 쪽이 이겨요. 하이는 그 조합에서 가장 높은 카드예요."));

  root.append(bp, pp, rk);

  // picker
  document.getElementById("picker")?.remove();
  document.body.classList.toggle("picking", active && !!H.sel);
  if (active && H.sel) {
    const used = new Set([...H.board, ...H.hands.slice(0, H.n).flat()].filter(c => c != null));
    const cur = slotVal(H.sel);
    const grid = h("div", { class: "grid" });
    for (let s = 0; s < 4; s++) for (let r = 14; r >= 2; r--) {
      const c = (r - 2) * 4 + s;
      grid.append(h("button", { class: (isRed(c) ? "red" : "") + (c === cur ? " cur" : ""), disabled: used.has(c) && c !== cur, "aria-label": `${RL(r)}${SUITS[s]}`,
        on: { click: () => { setSlot(H.sel, c); H.sel = nextEmpty(H.sel); hsave(); renderHoldem(); } } }, h("span", {}, RL(r)), h("span", { class: "s" }, SUITS[s])));
    }
    document.body.append(h("div", { class: "picker", id: "picker" }, h("div", { class: "in" },
      h("div", { class: "top" }, h("strong", {}, `${slotLabel(H.sel)} 고르기`),
        h("span", { class: "row-actions" },
          cur != null ? h("button", { class: "btn small", on: { click: () => { setSlot(H.sel, null); hsave(); renderHoldem(); } } }, "비우기") : null,
          h("button", { class: "btn small ghost", on: { click: () => { H.sel = null; hsave(); renderHoldem(); } } }, "닫기"))),
      grid)));
  }

  // equity, computed after paint
  clearTimeout(eqTimer);
  const anyCard = hands.some(hd => hd.some(c => c != null));
  if (!anyCard) return;
  eqTimer = setTimeout(() => {
    const r = equity(board, hands);
    hands.forEach((_, p) => {
      const el = document.getElementById(`eq-${p}`); if (!el) return;
      const w = r.win[p] / r.total * 100, t = r.tie[p] / r.total * 100;
      el.querySelector("i").style.width = `${w + t}%`;
      el.querySelector("b").textContent = `${w.toFixed(1)}%`;
      el.title = `이김 ${w.toFixed(1)}% · 비김 ${t.toFixed(1)}%`;
      if (t >= 0.1) el.querySelector("b").textContent += ` (+비김 ${t.toFixed(1)}%)`;
    });
    const note = document.getElementById("eq-note");
    if (note) note.textContent = r.exact
      ? `남은 카드의 모든 경우(${r.total.toLocaleString()}가지)를 계산한 정확한 승률이에요.`
      : `무작위로 ${r.total.toLocaleString()}판을 돌려 본 추정 승률이에요. 패를 모르는 사람은 무작위 카드로 가정해요.`;
  }, 30);
}

// ---------- tabs ----------
let TAB = "bounce";
try { TAB = localStorage.getItem("game-helper-tab") || "bounce"; } catch (e) {}
if (location.hash === "#holdem") TAB = "holdem";
if (location.hash === "#bounce") TAB = "bounce";
function setTab(t) {
  TAB = t;
  try { localStorage.setItem("game-helper-tab", t); } catch (e) {}
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  document.getElementById("app").hidden = t !== "bounce";
  document.getElementById("resetBox").hidden = t !== "bounce";
  document.getElementById("holdem").hidden = t !== "holdem";
  document.getElementById("sub").textContent = t === "bounce" ? "판마다 정답 카드를 뽑고, 어느 팀이 이겼는지 기록합니다" : "내 최고 족보와 승률을 보고, 누가 이겼는지 판정합니다";
  renderHoldem();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
setTab(TAB);
</script>

</html>
